services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: abdoozil
      POSTGRES_PASSWORD: abdoozil
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── pgAdmin ─────────────────────────────────────────────────────────────
  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── MongoDB ─────────────────────────────────────────────────────────────
  mongodb:
    container_name: ms_mongo_db
    image: mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo:/data
    environment:
      MONGO_INITDB_ROOT_USERNAME: abdoozil
      MONGO_INITDB_ROOT_PASSWORD: abdoozil
    networks:
      - mediconnect-net

  # ─── Mongo Express ───────────────────────────────────────────────────────
  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: abdoozil
      ME_CONFIG_MONGODB_ADMINPASSWORD: abdoozil
      ME_CONFIG_MONGODB_SERVER: mongodb
    networks:
      - mediconnect-net

  # ─── MailDev ─────────────────────────────────────────────────────────────
  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - mediconnect-net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    container_name: mediconnect-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass abdoozil
    volumes:
      - redis:/data
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Keycloak ────────────────────────────────────────────────────────────
  keycloak:
    container_name: mediconnect-keycloak
    image: quay.io/keycloak/keycloak:24.0.0
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Kafka UI ────────────────────────────────────────────────────────────
  kafka-ui:
    container_name: mediconnect-kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mediconnect
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # =========================================================================
  # OBSERVABILITÉ
  # =========================================================================

  # ─── Zipkin (Distributed Tracing) ────────────────────────────────────────
  zipkin:
    container_name: mediconnect-zipkin
    image: openzipkin/zipkin:3.4
    ports:
      - "9411:9411"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Prometheus (Métriques) ──────────────────────────────────────────────
  prometheus:
    container_name: mediconnect-prometheus
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - mediconnect-net
    restart: unless-stopped
    depends_on:
      - alertmanager

  # ─── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    container_name: mediconnect-alertmanager
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Loki (Agrégation de logs) ───────────────────────────────────────────
  loki:
    container_name: mediconnect-loki
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Promtail (Collecte des logs → Loki) ─────────────────────────────────
  promtail:
    container_name: mediconnect-promtail
    image: grafana/promtail:3.0.0
    volumes:
      - ./observability/loki/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - mediconnect-net
    restart: unless-stopped
    depends_on:
      - loki

  # ─── Grafana (Dashboards) ────────────────────────────────────────────────
  grafana:
    container_name: mediconnect-grafana
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana:/var/lib/grafana
    networks:
      - mediconnect-net
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - zipkin

networks:
  mediconnect-net:
    driver: bridge

volumes:
  postgres:
  mongo:
  redis:
  prometheus:
  grafana:
  loki:
  influxdb: