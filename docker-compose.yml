services:

  # ─── PostgreSQL (existant — réutilisé) ───────────────────────────────────
  postgres:
    container_name: ms_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: abdoozil
      POSTGRES_PASSWORD: abdoozil
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── pgAdmin (existant — réutilisé) ──────────────────────────────────────
  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── MongoDB (existant — réutilisé) ──────────────────────────────────────
  mongodb:
    container_name: ms_mongo_db
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data
    environment:
      MONGO_INITDB_ROOT_USERNAME: abdoozil
      MONGO_INITDB_ROOT_PASSWORD: abdoozil
    networks:
      - mediconnect-net

  # ─── Mongo Express (existant — réutilisé) ────────────────────────────────
  mongo-express:
    container_name: ms_mongo_express
    image: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: abdoozil
      ME_CONFIG_MONGODB_ADMINPASSWORD: abdoozil
      ME_CONFIG_MONGODB_SERVER: mongodb
    networks:
      - mediconnect-net

  # ─── MailDev (existant — réutilisé) ──────────────────────────────────────
  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - mediconnect-net

  # ─── Redis (NOUVEAU) ─────────────────────────────────────────────────────
  redis:
    container_name: mediconnect-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass abdoozil
    volumes:
      - redis:/data
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Keycloak (NOUVEAU) ──────────────────────────────────────────────────
  keycloak:
    container_name: mediconnect-keycloak
    image: quay.io/keycloak/keycloak:24.0.0
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── InfluxDB (NOUVEAU — pour IoT service) ───────────────────────────────
  influxdb:
    container_name: mediconnect-influxdb
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: abdoozil
      DOCKER_INFLUXDB_INIT_PASSWORD: abdoozil123
      DOCKER_INFLUXDB_INIT_ORG: mediconnect
      DOCKER_INFLUXDB_INIT_BUCKET: iot-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mediconnect-influx-token-2024
    volumes:
      - influxdb:/var/lib/influxdb2
    networks:
      - mediconnect-net
    restart: unless-stopped

  # ─── Kafka UI (NOUVEAU — interface visuelle Kafka) ────────────────────────
  kafka-ui:
    container_name: mediconnect-kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mediconnect
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mediconnect-net
    restart: unless-stopped

networks:
  mediconnect-net:
    driver: bridge

volumes:
  postgres:
  mongo:
  redis:
  influxdb: