global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:1025'
  smtp_from: 'alertmanager@mediconnect.africa'
  smtp_require_tls: false

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@mediconnect.africa'
        headers:
          subject: '[MediConnect] Alerte: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alerte  : {{ .Annotations.summary }}
          Détail  : {{ .Annotations.description }}
          Sévérité: {{ .Labels.severity }}
          Service : {{ .Labels.job }}
          Heure   : {{ .StartsAt }}
          {{ end }}

  - name: 'critical-receiver'
    email_configs:
      - to: 'admin@mediconnect.africa'
        send_resolved: true
        headers:
          subject: '🔴 [MediConnect CRITIQUE] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          🔴 ALERTE CRITIQUE
          Résumé  : {{ .Annotations.summary }}
          Détail  : {{ .Annotations.description }}
          Service : {{ .Labels.job }}
          Heure   : {{ .StartsAt }}
          {{ end }}

  - name: 'warning-receiver'
    email_configs:
      - to: 'admin@mediconnect.africa'
        send_resolved: true
        headers:
          subject: '⚠️ [MediConnect WARNING] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          ⚠️ AVERTISSEMENT
          Résumé  : {{ .Annotations.summary }}
          Détail  : {{ .Annotations.description }}
          Service : {{ .Labels.job }}
          Heure   : {{ .StartsAt }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['job']