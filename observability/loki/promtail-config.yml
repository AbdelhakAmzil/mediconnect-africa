server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ─── Logs des conteneurs Docker ──────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: network
            values: ["mediconnect-net"]
    relabel_configs:
      # Utiliser le nom du conteneur comme label "service"
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      # Conserver le nom de l'image
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      # Label "job" = nom du conteneur
      - source_labels: ['__meta_docker_container_name']
        regex: '/mediconnect-(.*)'
        target_label: 'job'
        replacement: '$1'

    pipeline_stages:
      # Parser les logs JSON Spring Boot
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            timestamp: '"@timestamp"' # Sécurisé avec des guillemets pour JMESPath
      # Mapper le niveau de log
      - labels:
          level:
          logger:
      # Filtrer les logs de niveau supérieur à DEBUG en prod
      - match:
          selector: '{job=~".+"}'
          stages:
            - json:
                expressions:
                  log_level: '"level"' # Ajout des guillemets pour éviter le crash JMESPath